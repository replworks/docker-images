name: Build images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wifinote-runtime/**"
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read
  packages: write

jobs:
  wifinote-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./wifinote-runtime
          platforms: linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/replworks/wifinote-runtime:php8.4
            ghcr.io/replworks/wifinote-runtime:php8.4-${{ github.run_number }}
